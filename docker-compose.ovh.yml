# Docker Compose configuration for production/server (OVH)
# Uses external RustFS for S3 storage instead of local MinIO
# Usage: docker compose -f docker-compose.ovh.yml up -d

services:
    app:
        build:
            context: './docker/dev/php'
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP}'
                NODE_VERSION: '20'
        image: 'sail-8.3/app'
        extra_hosts:
        - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            PHP_CS_FIXER_IGNORE_ENV: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
            - rustfs-network
        depends_on:
            - pgsql
            - redis
            - mailpit
            # - soketi  # Odkomentuj jeśli chcesz WebSockets

    pgsql:
        image: 'postgres:17'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
        volumes:
            - 'sail-pgsql:/var/lib/postgresql/data'
            - './docker/dev/pgsql/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 3
            timeout: 5s

    redis:
        image: 'redis:8-alpine'
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - -a
                - '${REDIS_PASSWORD}'
                - ping
            retries: 3
            timeout: 5s

    mailpit:
        image: 'axllent/mailpit:latest'
        networks:
            - sail

    # WebSockets (opcjonalnie - odkomentuj jeśli potrzebujesz)
    # soketi:
    #     image: 'quay.io/soketi/soketi:latest-16-alpine'
    #     environment:
    #         SOKETI_DEBUG: '${SOKETI_DEBUG:-1}'
    #         SOKETI_METRICS_SERVER_PORT: '9601'
    #         SOKETI_DEFAULT_APP_ID: '${PUSHER_APP_ID}'
    #         SOKETI_DEFAULT_APP_KEY: '${PUSHER_APP_KEY}'
    #         SOKETI_DEFAULT_APP_SECRET: '${PUSHER_APP_SECRET}'
    #     ports:
    #         - '${PUSHER_PORT:-6001}:6001'
    #         - '${PUSHER_METRICS_PORT:-9601}:9601'
    #     networks:
    #         - sail

    # Meilisearch (opcjonalnie - odkomentuj jeśli potrzebujesz)
    # meilisearch:
    #     image: getmeili/meilisearch:latest
    #     ports:
    #         - "7700:7700"
    #     environment:
    #         MEILI_NO_ANALYTICS: "true"
    #         MEILI_MASTER_KEY: "masterKey"
    #     volumes:
    #         - meilisearch_data:/meili_data
    #     networks:
    #         - sail

networks:
    sail:
        driver: bridge
    # Sieć współdzielona z RustFS dla storage S3
    rustfs-network:
        external: true

volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
    # Odkomentuj jeśli używasz Meilisearch
    # meilisearch_data:
    #     driver: local
